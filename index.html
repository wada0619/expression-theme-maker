<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表情お題メーカー</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/analytics.js"></script>
</head>
<body>
  <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="sideMenu">
    <span class="menu-toggle__icon" aria-hidden="true"></span>
    <span class="visually-hidden">メニューを開く</span>
  </button>

  <div class="side-menu-backdrop" id="sideMenuBackdrop" hidden></div>

  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="メニュー">
    <div class="side-menu__header">
      <h2 class="side-menu__title">メニュー</h2>
      <button type="button" class="side-menu__close" id="sideMenuClose" aria-label="メニューを閉じる">×</button>
    </div>
    <nav class="side-menu__nav" aria-label="サイドメニュー">
      <a href="index.html" class="side-menu__link" aria-current="page">トップ</a>
      <a href="today.html" class="side-menu__link">今日のお題</a>
      <a href="howto.html" class="side-menu__link">使い方</a>
    </nav>
  </aside>

  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <h1 class="brand__name">表情お題メーカー</h1>
        <p class="brand__sub">創作のヒントを見つける、お題づくり</p>
      </div>
    </header>

    <section class="category-bar" aria-label="カテゴリ選択">
      <p class="category-bar__label">お題に含める要素</p>
      <div class="category-chips" id="categoryChips" role="group">
        <label class="chip" for="category-expression">
          <input type="checkbox" id="category-expression" data-category-toggle="expression" checked>
          <span class="chip__dot" aria-hidden="true"></span>
          <span class="chip__text">表情</span>
        </label>
        <label class="chip" for="category-emotion">
          <input type="checkbox" id="category-emotion" data-category-toggle="emotion">
          <span class="chip__dot" aria-hidden="true"></span>
          <span class="chip__text">感情</span>
        </label>
        <label class="chip" for="category-situation">
          <input type="checkbox" id="category-situation" data-category-toggle="situation">
          <span class="chip__dot" aria-hidden="true"></span>
          <span class="chip__text">状況</span>
        </label>
      </div>
    </section>

    <main>
      <section class="prompt-stage" aria-live="polite">
        <p class="prompt-stage__label">お題</p>
        <p class="prompt-stage__text is-placeholder" id="promptText">生成を押すと、ここにランダムなお題が出ます</p>
        <div class="prompt-stage__meta" id="promptMeta" hidden></div>
      </section>

      <div class="action-bar">
        <button type="button" class="btn btn-generate" id="generateBtn">生成する</button>
        <div class="btn-row">
          <button type="button" class="btn btn-quiet" id="copyBtn" disabled>お題をコピー</button>
          <button type="button" class="btn btn-quiet" id="shareBtn">リンクをコピー</button>
        </div>
      </div>
    </main>

    <section class="history" aria-label="履歴">
      <div class="history__header">
        <h2 class="history__title">履歴</h2>
        <p class="history__hint">直近 10 件・このタブ内のみ</p>
      </div>
      <ul class="history__list" id="historyList">
        <li class="history__empty">まだ履歴はありません</li>
      </ul>
    </section>

    <footer class="site-footer">
      <nav class="site-footer__nav" aria-label="フッターナビゲーション">
        <a href="about.html">このサイトについて</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="terms.html">利用規約</a>
        <a href="contact.html">お問い合わせ</a>
      </nav>
      <p class="site-footer__tagline">創作のヒントを見つける、お題づくりのプラットフォーム</p>
    </footer>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
