<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のお題 | 表情お題メーカー</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/analytics.js"></script>
</head>
<body>
  <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="sideMenu">
    <span class="menu-toggle__icon" aria-hidden="true"></span>
    <span class="visually-hidden">メニューを開く</span>
  </button>

  <div class="side-menu-backdrop" id="sideMenuBackdrop" hidden></div>

  <aside class="side-menu" id="sideMenu" aria-hidden="true" aria-label="メニュー">
    <div class="side-menu__header">
      <h2 class="side-menu__title">メニュー</h2>
      <button type="button" class="side-menu__close" id="sideMenuClose" aria-label="メニューを閉じる">×</button>
    </div>
    <nav class="side-menu__nav" aria-label="サイドメニュー">
      <a href="index.html" class="side-menu__link">トップ</a>
      <a href="today.html" class="side-menu__link" aria-current="page">今日のお題</a>
      <a href="howto.html" class="side-menu__link">使い方</a>
    </nav>
  </aside>

  <div class="app">
    <main class="page">
      <a href="index.html" class="back-link">← トップへ戻る</a>
      <h1 class="page-title page-title--center">今日のお題</h1>
      <p class="daily-date" id="dailyDate">読み込み中…</p>

      <section class="prompt-stage" aria-live="polite">
        <p class="prompt-stage__label">みんなで同じお題</p>
        <p class="prompt-stage__text is-placeholder" id="dailyPrompt">お題を用意しています…</p>
        <div class="prompt-stage__meta" id="dailyMeta" hidden></div>
      </section>

      <div class="action-bar">
        <button type="button" class="btn btn-generate" id="dailyCopyBtn" disabled>お題をコピー</button>
        <a href="index.html" class="btn btn-quiet btn-link">自分でお題を作る</a>
      </div>

      <p class="daily-note">
        みんなで同じお題に挑戦できます。
        日付が変わると（日本時間の0時）新しいお題になります。
      </p>
    </main>

    <footer class="site-footer">
      <nav class="site-footer__nav" aria-label="フッターナビゲーション">
        <a href="about.html">このサイトについて</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="terms.html">利用規約</a>
        <a href="contact.html">お問い合わせ</a>
      </nav>
      <p class="site-footer__tagline">創作のヒントを見つける、お題づくりのプラットフォーム</p>
    </footer>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/daily.js"></script>
</body>
</html>
